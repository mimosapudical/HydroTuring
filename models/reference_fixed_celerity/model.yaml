name: reference_fixed_celerity
version: "1.0.0"
description: >
  Deliberately broken momentum control. It converts effective precipitation to
  discharge and delays it to the centre gauge at exactly 1 m/s for every
  hydraulic state. Its steady stage is Manning-consistent, so the only intended
  defect is that transient propagation speed cannot respond to state.
authors: ["HydroTuring maintainers"]
license: PolyForm-Noncommercial-1.0.0
runner: subprocess
entrypoint: [python3, ht_adapter.py]
timestep: PT1H
emits:
  fluxes: [dis]
  states: []
  diagnostics: [stage]
needs_forcing: [pr, pet]
needs_static: [area_km2, width_m, cross_section_shape, bed_elevation_m, slope, manning_n, reach_length_m]
supports:
  perturbation: false
resources: {cpu: 1, memory_gb: 1, gpu: false}
