id: momentum/wave-celerity-bounds
title: Transient flood-wave celerity responds to hydraulic state
law: momentum
track: synthetic
version: 1

authors:
  - name: Jingzhi Chen
    github: mimosapudical
    affiliation: Department of Computer Science and Engineering, State University of New York at Buffalo, Buffalo, NY, USA

description: >
  Low, medium and high steady river inflows are each perturbed by the same
  small pulse in a short and a long rectangular reach. The prescribed q_in
  enters the routing control volume directly: forcing and every static
  attribute except reach length are paired, so the short/long centroid
  difference isolates propagation over the additional outlet travel distance
  from dis alone. Observed celerity must be positive, remain within five percent of the
  independently computed Manning/kinematic dQ/dA expectation, and increase
  with hydraulic state. A fixed positive celerity can conserve mass, remain
  causal and pass gross routing-lag tests while still failing this
  state-response requirement.

citation: https://doi.org/10.1080/02626660109492830

requires:
  fluxes: [dis]
  forcing: [q_in]
  static: [width_m, cross_section_shape, slope, manning_n, reach_length_m]

case:
  generator: generate.py
  n_seeds: 3
  timestep: PT1H
  period_days: 24
  spinup_days: 20
  min_window_days: 24
  max_output_mb: 2.0
  max_runtime_s: 300
  variants: [short, long]

criteria:
  - wave_celerity_bounds:
      states: [low, medium, high]
      event_columns:
        low: _pulse_low
        medium: _pulse_medium
        high: _pulse_high
      response_hours: 72
      relative_tolerance: 0.05
      baseline_hours: 12
      min_response_fraction: 0.0001
      timing_floor_hours: 0.05
      ordering_margin_fraction: 0.05

baselines:
  must_pass:
    - reference_saint_venant
  must_fail:
    reference_fixed_celerity: wave_celerity_bounds

provenance: >
  Synthetic hourly prescribed river inflow and seeded rectangular reach
  geometry generated at run time. The positive reference advances the one-dimensional Saint-Venant
  equations with the repository's finite-volume Rusanov solver; the criterion
  independently derives dQ/dA from the declared Manning geometry. Implements
  accepted proposal #148.
