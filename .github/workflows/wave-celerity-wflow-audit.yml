name: wave-celerity-reference-profile

on:
  push:
    branches: [probe-wave-celerity-bounds]
    paths:
      - '.github/workflows/wave-celerity-wflow-audit.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Profile one Saint-Venant gate seed
        run: |
          mkdir -p /tmp/wave-ref
          /usr/bin/time -f 'REF_ONE_SEED_WALL=%e' \
            ht run --model reference_saint_venant \
                   --probe momentum/wave-celerity-bounds \
                   --seed 397273707 \
                   --workdir /tmp/wave-ref \
                   --markdown
          echo '--- RUN JSON ---'
          find /tmp/wave-ref -name run.json -print -exec cat {} \;
