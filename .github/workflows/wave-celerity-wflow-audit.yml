name: wave-celerity-wflow-audit

on:
  push:
    branches: [probe-wave-celerity-bounds]
    paths:
      - '.github/workflows/wave-celerity-wflow-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate and focused tests
        run: |
          ht validate
          pytest -q tests/test_wave_celerity_bounds.py tests/test_routing_inflow_contract.py
      - name: Re-evaluate final #148 criterion on Wflow
        run: |
          ht run --model wflow_sbm \
                 --probe momentum/wave-celerity-bounds \
                 --gate-seeds \
                 --csv models/result.csv \
                 --markdown | tee /tmp/wflow-wave-final.txt
      - name: Commit final independent-evidence row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/result.csv
          git diff --cached --quiet && exit 0
          git commit -m "results: refresh Wflow wave-celerity evidence"
          git push origin HEAD:probe-wave-celerity-bounds
