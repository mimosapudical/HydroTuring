name: wave-celerity-runtime-audit

on:
  push:
    branches: [probe-wave-celerity-bounds]
    paths:
      - '.github/workflows/wave-celerity-wflow-audit.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Measure focused acceptance gate
        run: |
          /usr/bin/time -f 'WAVE_GATE_WALL=%e' \
            ht gate --probe momentum/wave-celerity-bounds
