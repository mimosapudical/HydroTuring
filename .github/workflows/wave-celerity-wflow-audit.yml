name: wave-celerity-wflow-audit

on:
  push:
    branches: [probe-wave-celerity-bounds]
    paths:
      - '.github/workflows/wave-celerity-wflow-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate and focused tests
        run: |
          ht validate
          pytest -q tests/test_wave_celerity_bounds.py
      - name: Re-evaluate Wflow ht.5 on every probe
        run: |
          set +e
          ht run --model wflow_sbm \
                 --gate-seeds \
                 --csv /tmp/wflow-ht5.csv \
                 --markdown | tee /tmp/wflow-full.txt
          code=${PIPESTATUS[0]}
          cat /tmp/wflow-full.txt
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wflow-ht5-archive
          path: /tmp/wflow-ht5.csv
