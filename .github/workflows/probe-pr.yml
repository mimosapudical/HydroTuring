name: probe

# Validates the benchmark itself. Runs on every change to a probe, to the
# harness, or to a reference model, because any of the three can silently
# break the acceptance gate.
#
# Read-only token and no secrets: a probe is arbitrary Python from a
# contributor and must never see a credential.

on:
  pull_request:
    paths:
      - 'probes/**'
      - 'src/**'
      - 'schemas/**'
      - 'models/**'
      - '.gitattributes'
      - '.github/workflows/probe-pr.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Data budget
        # Probes ship a seeded generator, not a dataset. Anything large that
        # appears under probes/ is a mistake, and it is much cheaper to catch
        # here than after it is in the history.
        run: |
          oversized=$(find probes -type f -size +1M -not -name '*.md' || true)
          if [ -n "$oversized" ]; then
            echo "::error::probes must ship a generator, not data. Oversized files:"
            echo "$oversized"
            exit 1
          fi
          echo "no committed probe data over 1 MB"

      - name: Validate specs
        run: ht validate

      - name: Harness tests
        run: pytest -q

      - name: Acceptance gate
        # The load-bearing step. Every probe must pass the physically exact
        # reference model and must fail each deliberately broken one, on the
        # specific criterion declared to do the catching.
        run: ht gate

  container:
    # The reference models run via subprocess so the gate stays fast, which
    # means the container path would otherwise go untested until a real
    # submission arrived. GitHub runners have Docker, so exercise it here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run a known-good model through the container path
        run: |
          ht run --model reference_bucket \
                 --probe mass/catchment-closure \
                 --seed 4242 \
                 --runner docker


  lisflood_evidence:
    # TEMPORARY ROUND-2 DIAGNOSTIC. Remove after collecting #148 evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Diagnose LISFLOOD short/long base discharge
        run: |
          set +e
          rm -rf /tmp/lisdiag
          ht run --model lisflood \
                 --probe momentum/wave-celerity-bounds \
                 --seed 397273707 \
                 --workdir /tmp/lisdiag \
                 > /tmp/lisflood-wave-report.txt 2>&1
          rc=$?
          echo "LISFLOOD_WAVE_RC=$rc"
          cat /tmp/lisflood-wave-report.txt
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd

          root = Path("/tmp/lisdiag")
          spin = 20 * 24
          block = 8 * 24
          settle = 4 * 24
          states = ["low", "medium", "high"]
          lengths = {"short": 4000.0, "long": 20000.0}
          tables = {}
          statics = {}

          for side in ("short", "long"):
              matches = list(root.glob(f"**/*{side}/output/result.csv"))
              if not matches:
                  raise FileNotFoundError(
                      f"no {side} result under {root}; found {list(root.rglob('result.csv'))}"
                  )
              result = matches[0]
              d = result.parents[1]
              tables[side] = pd.read_csv(result)
              statics[side] = json.loads((d / "input/static.json").read_text())
              print(f"DIAG_DIR {side}={d}")

          print("BASE_DIAGNOSTICS_BEGIN")
          for i, state in enumerate(states):
              pulse = spin + i * block + settle
              bases = {}
              cents = {}
              for side in ("short", "long"):
                  q = pd.to_numeric(tables[side]["dis"], errors="raise").to_numpy(float)
                  base = float(np.mean(q[pulse-12:pulse]))
                  bases[side] = base
                  stop = min(len(q), pulse + 72)
                  resp = np.clip(q[pulse:stop] - base, 0.0, None)
                  if resp.sum() > 0:
                      centres = np.arange(pulse, stop, dtype=float) + 0.5
                      cents[side] = float(np.dot(centres, resp) / resp.sum())
                  else:
                      cents[side] = float("nan")
              rel = abs(bases["long"] - bases["short"]) / max(abs(bases["short"]), 1e-12)
              dt_h = cents["long"] - cents["short"]
              c_obs = (lengths["long"] - lengths["short"]) / (dt_h * 3600.0) if dt_h > 0 else float("nan")
              print(
                  f"STATE={state} q_short={bases['short']:.9g} q_long={bases['long']:.9g} "
                  f"base_rel_diff={rel:.6%} centroid_short_h={cents['short']:.6f} "
                  f"centroid_long_h={cents['long']:.6f} dt_h={dt_h:.6f} c_obs={c_obs:.6f}"
              )
          print("BASE_DIAGNOSTICS_END")
          PY
          exit 0


  wave_celerity_evidence:
    # TEMPORARY FOR FORK CI ONLY. Removed after Round 2 evidence is collected.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run LISFLOOD on wave-celerity gate seeds
        run: |
          set +e
          rm -f /tmp/wave.csv
          ht run --model lisflood                  --probe momentum/wave-celerity-bounds                  --gate-seeds                  --csv /tmp/wave.csv                  > /tmp/lisflood-wave-report.txt 2>&1
          rc=$?
          echo "LISFLOOD_RC=$rc"
          echo "LISFLOOD_REPORT_BEGIN"
          cat /tmp/lisflood-wave-report.txt
          echo "LISFLOOD_REPORT_END"
          echo "LISFLOOD_CSV_BEGIN"
          cat /tmp/wave.csv || true
          echo "LISFLOOD_CSV_END"
          exit "$rc"
