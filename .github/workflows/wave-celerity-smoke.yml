name: wave-celerity-smoke

on:
  pull_request:
    paths:
      - 'probes/momentum/wave-celerity-bounds/**'
      - 'src/hydroturing/criteria/**'
      - 'models/reference_saint_venant/**'
      - 'models/reference_fixed_celerity/**'
      - 'models/lisflood/**'
      - 'tests/test_wave_celerity_bounds.py'
      - '.github/workflows/wave-celerity-smoke.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate
        run: ht validate
      - name: Focused unit tests
        run: pytest -q tests/test_wave_celerity_bounds.py tests/test_report_detail.py
      - name: Reference acceptance gate
        run: ht gate --probe momentum/wave-celerity-bounds
      - name: LISFLOOD independent physical evidence
        run: |
          set -o pipefail
          rm -f /tmp/lisflood-wave.csv
          ht run --model lisflood \
            --probe momentum/wave-celerity-bounds \
            --gate-seeds \
            --csv /tmp/lisflood-wave.csv \
            2>&1 | tee /tmp/lisflood-wave.log
          echo "LISFLOOD_ARCHIVE_ROW_BEGIN"
          cat /tmp/lisflood-wave.csv
          echo "LISFLOOD_ARCHIVE_ROW_END"
